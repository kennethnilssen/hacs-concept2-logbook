<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Concept2 Logbook integration icon, compact variant for small sizes" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Concept2 Logbook – compact icon (use below 48 px)</title>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tile"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#060a14"/>
    <circle cx="110" cy="120" r="150" fill="#64ffda" opacity="0.16" filter="url(#blur)"/>
    <circle cx="420" cy="440" r="160" fill="#ffb74d" opacity="0.13" filter="url(#blur)"/>
  </g>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <g transform="translate(4 -12)">
    <g filter="url(#glow)">
      <path d="M120 376 L404 416 M120 376 V440" fill="none" stroke="#64ffda" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="126" cy="326" r="64" fill="#64ffda" fill-opacity="0.12" stroke="#64ffda" stroke-width="18"/>
      <circle cx="126" cy="326" r="14" fill="#64ffda"/>
      <line x1="126" y1="262" x2="126" y2="226" stroke="#64ffda" stroke-width="18" stroke-linecap="round"/>
      <line x1="244" y1="314" x2="244" y2="348" stroke="#64ffda" stroke-width="16" stroke-linecap="round"/>
      <rect x="290" y="374" width="70" height="22" rx="11" fill="#64ffda"/>
      <rect x="56" y="132" width="140" height="94" rx="20" fill="#64ffda" fill-opacity="0.08" stroke="#64ffda" stroke-width="16"/>
    </g>
    <g filter="url(#glow)">
      <path d="M84 210 C 102 210, 110 162, 126 162 C 144 162, 152 202, 170 210" fill="none" stroke="#ffb74d" stroke-width="13" stroke-linecap="round"/>
      <polyline points="260,160 292,182 260,204" fill="none" stroke="#ffb74d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g filter="url(#glow)">
      <polyline points="340,164 404,104 468,164" fill="none" stroke="#64ffda" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="360,152 360,216 448,216 448,152" fill="none" stroke="#64ffda" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="404" cy="182" r="12" fill="#ffb74d"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
